name: Import reviewed toolkit files once
on:
  push:
    paths: ['.github/workflows/import-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write reviewed public files batch 1
        shell: python
        run: |
          import json
          from pathlib import Path
          files = json.loads(r'''{
            ".github/workflows/tests.yml": "name: tests\non: [push, pull_request]\npermissions:\n  contents: read\njobs:\n  test:\n    runs-on: ubuntu-latest\n    strategy:\n      matrix:\n        python-version: ['3.10', '3.12']\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: __RDT_GH_EXPR__ matrix.python-version }}\n      - run: python -m pip install -e '.[integrations]'\n      - run: python -m unittest discover -s tests -v\n",
            ".gitignore": "__pycache__/\n*.py[cod]\n.venv/\n*.egg-info/\nbuild/\ndist/\n.env\nprivate_data/\n",
            "ATTRIBUTION.md": "# 开源来源与改进说明\n\n本项目在 AI 辅助下整理与实现。以下项目的名称、许可及功能通过其官方 GitHub 仓库查阅；未复制或修改这些上游项目的源码，也未声称拥有其实现。\n\n| 来源 | 许可证 | 本项目使用方式 | 本项目新增内容 |\n| --- | --- | --- | --- |\n| [microsoft/markitdown](https://github.com/microsoft/markitdown) | [MIT](https://github.com/microsoft/markitdown/blob/main/LICENSE) | 可选运行时依赖，调用 MarkItDown 的本地文件转换公共 API | 转换后的中文空白规范化、段落分块、来源文件与 SHA-256、JSONL 和处理统计 |\n| [frictionlessdata/frictionless-py](https://github.com/frictionlessdata/frictionless-py) | [MIT](https://github.com/frictionlessdata/frictionless-py/blob/main/LICENSE.md) | 可选运行时依赖，调用 Resource 的推断与校验公共 API | 中文 Markdown 报告、缺失与重复统计、逐列概况、统一 CLI 和人工示例 |\n| [wireservice/csvkit](https://github.com/wireservice/csvkit) | [MIT](https://github.com/wireservice/csvkit/blob/master/COPYING) | 参考 csvstat 文档中的列概况思路；不是运行依赖 | 按本项目规则独立实现简化统计，并输出中文研究检查报告 |\n\n文献内置解析器由作者此前的个人 EPUB 提取脚本演进：移除了固定文件路径，补充通用 CLI、输入检查、隐藏标签过滤、长段落分块、来源散列和测试。未将原文献内容、原始 EPUB 或个人路径复制进本仓库。\n\n来源清单模块为本项目新增的本地规则校验，不采用学术引用标准，也不宣称等同于 Zotero 或其他文献管理系统。\n\n可选依赖通过包管理器独立安装，其许可和第三方声明由原包提供。今后如直接复制上游源码，应额外保留对应版权及许可证，并记录文件路径、版本与修改内容。\n",
            "examples/output/clean/chunks.jsonl": "{\"id\": \"701a51079da6-1-1\", \"title\": \"sample\", \"author\": \"\", \"source_file\": \"sample.txt\", \"source_sha256\": \"701a51079da6d5e89efd1efcae96e8bb0669c6ca12f2798af9eadf3ca28a12f5\", \"section\": 1, \"source_member\": \"sample.txt\", \"text\": \"研究资料示例\\n\\n这是一段人工构造的研究摘要。 用于展示空白字符规范化与段落保留。\\n\\n第二段记录资料整理的方法：保留来源、记录处理过程，并对原始信息进行核验。\"}\n",
            "examples/output/clean/document.md": "# sample\n\n来源：sample.txt\n作者：未提供\n\n## 内容 1\n\n研究资料示例\n\n这是一段人工构造的研究摘要。 用于展示空白字符规范化与段落保留。\n\n第二段记录资料整理的方法：保留来源、记录处理过程，并对原始信息进行核验。\n",
            "examples/output/clean/stats.json": "{\n  \"source_file\": \"sample.txt\",\n  \"source_sha256\": \"701a51079da6d5e89efd1efcae96e8bb0669c6ca12f2798af9eadf3ca28a12f5\",\n  \"engine\": \"builtin\",\n  \"sections\": 1,\n  \"characters\": 78,\n  \"chunks\": 1,\n  \"chunk_size\": 80\n}\n",
            "examples/output/markitdown/chunks.jsonl": "{\"id\": \"a701bb0534ba-1-1\", \"title\": \"plain\", \"author\": \"\", \"source_file\": \"plain.txt\", \"source_sha256\": \"a701bb0534ba572e6fd49b49d5c1d1e7213d6f67708f971fa6058d566f8a116f\", \"section\": 1, \"source_member\": \"plain.txt\", \"text\": \"科研资料整理示例\\n\\n资料清洗后应保留来源信息，方便后续核验与引用。\\n\\n本文件由人工构造，不含真实研究数据。\"}\n",
            "examples/output/markitdown/document.md": "# plain\n\n来源：plain.txt\n作者：未提供\n\n## 内容 1\n\n科研资料整理示例\n\n资料清洗后应保留来源信息，方便后续核验与引用。\n\n本文件由人工构造，不含真实研究数据。\n",
            "examples/output/markitdown/stats.json": "{\n  \"source_file\": \"plain.txt\",\n  \"source_sha256\": \"a701bb0534ba572e6fd49b49d5c1d1e7213d6f67708f971fa6058d566f8a116f\",\n  \"engine\": \"markitdown\",\n  \"sections\": 1,\n  \"characters\": 53,\n  \"chunks\": 1,\n  \"chunk_size\": 80\n}\n",
            "examples/output/quality-frictionless.md": "# CSV 数据质量检查\n\n文件：sample.csv\n\n数据行数：4；列数：4；重复行数：1\n\n重复行指完全相同的原始字段组合，计数不包含首次出现；空白值仅用于缺失统计，不改写源文件。\n\n| 列名 | 推断类型 | 缺失数 | 非空不同值 | 最小值 | 最大值 | 均值 |\n| --- | --- | ---: | ---: | ---: | ---: | ---: |\n| 城市 | text | 0 | 3 | — | — | — |\n| 年份 | integer | 0 | 1 | 2025 | 2025 | 2025 |\n| 样本数 | integer | 1 | 2 | 12 | 18 | 16 |\n| 备注 | text | 2 | 2 | — | — | — |\n\n类型为启发式推断，不代替业务口径核验；前导零、非有限值和混合类型按文本处理。\n\n## Frictionless 开源校验\n\n上游校验通过：True\n\n| 行 | 字段 | 问题代码 | 说明 |\n| --- | --- | --- | --- |\n\n上游校验使用自动推断的结构；通过不代表数据已满足具体研究的业务要求。\n",
            "examples/output/quality.md": "# CSV 数据质量检查\n\n文件：sample.csv\n\n数据行数：4；列数：4；重复行数：1\n\n重复行指完全相同的原始字段组合，计数不包含首次出现；空白值仅用于缺失统计，不改写源文件。\n\n| 列名 | 推断类型 | 缺失数 | 非空不同值 | 最小值 | 最大值 | 均值 |\n| --- | --- | ---: | ---: | ---: | ---: | ---: |\n| 城市 | text | 0 | 3 | — | — | — |\n| 年份 | integer | 0 | 1 | 2025 | 2025 | 2025 |\n| 样本数 | integer | 1 | 2 | 12 | 18 | 16 |\n| 备注 | text | 2 | 2 | — | — | — |\n\n类型为启发式推断，不代替业务口径核验；前导零、非有限值和混合类型按文本处理。\n",
            "examples/output/sources.md": "# 研究资料来源清单\n\n文件：sources.csv；记录数：3；问题数：2\n\n本工具仅进行本地格式检查，不访问链接，也不确认资料真实性或可用性。\n\n| CSV 行 | 标题 | 机构 | 日期 | 链接 | 备注 |\n| ---: | --- | --- | --- | --- | --- |\n| 2 | 文献整理方法示例 | 示例研究机构 | 2026-10-01 | https://example.org/methods | 人工构造 不代表真实研究 |\n| 3 | 数据口径示例 | 示例数据机构 | 2026-10-02 | https://example.org/data | 人工构造 |\n| 4 | 重复链接示例 | 示例研究机构 | 2026-02-30 | https://example.org/methods | 用于展示日期错误与重复检查 |\n\n## 问题报告\n\n| CSV 行 | 问题代码 | 说明 |\n| ---: | --- | --- |\n| 4 | invalid_date | 日期须为有效的 YYYY-MM-DD |\n| 4 | duplicate_url | 链接与第 2 行重复 |\n",
            "examples/plain.txt": "科研资料整理示例\n\n资料清洗后应保留来源信息，方便后续核验与引用。\n\n本文件由人工构造，不含真实研究数据。\n",
            "examples/sample.csv": "城市,年份,样本数,备注\n北京,2025,12,人工示例\n上海,2025,18,\n上海,2025,18,\n广州,2025,,待补充\n",
            "examples/sample.txt": "<h1>研究资料示例</h1>\n<p>这是一段人工构造的研究摘要。   用于展示空白字符规范化与段落保留。</p>\n\n<p>第二段记录资料整理的方法：保留来源、记录处理过程，并对原始信息进行核验。</p>\n<script>这段脚本不应出现在正文中。</script>\n",
            "examples/sources.csv": "title,institution,date,url,notes\n文献整理方法示例,示例研究机构,2026-10-01,https://example.org/methods,人工构造 不代表真实研究\n数据口径示例,示例数据机构,2026-10-02,https://example.org/data,人工构造\n重复链接示例,示例研究机构,2026-02-30,https://example.org/methods,用于展示日期错误与重复检查\n",
            "LICENSE": "MIT License\n\nCopyright (c) 2026 ooljhg\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n"
          }''')
          for name, content in files.items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts:
                  raise ValueError('Invalid repository path')
              path.parent.mkdir(parents=True, exist_ok=True)
              content = content.replace('__RDT_GH_EXPR__', '$' + '{{')
              path.write_text(content, encoding='utf-8', newline='\n')
          print(f'Imported {len(files)} reviewed public files')
      - name: Write reviewed public files batch 2
        shell: python
        run: |
          import json
          from pathlib import Path
          files = json.loads(r'''{
            "pyproject.toml": "[build-system]\nrequires = [\"setuptools>=68\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"research-data-toolkit\"\nversion = \"0.1.0\"\ndescription = \"Local research text cleaning, CSV quality reports and source management\"\nreadme = \"README.md\"\nrequires-python = \">=3.10\"\nlicense = {text = \"MIT\"}\n\n[project.optional-dependencies]\nintegrations = [\"markitdown==0.1.6\", \"frictionless==5.18.1\"]\n\n[project.scripts]\nresearch-data = \"research_data_toolkit.__main__:main\"\n\n[tool.setuptools.packages.find]\ninclude = [\"research_data_toolkit*\"]\n",
            "README.md": "# Research Data Toolkit 科研资料工具集\n\n面向资料整理、课程研究与科研辅助的小型 Python 命令行工具集。支持文献文本清洗、CSV 质量检查、研究来源清单管理。基础模式只使用 Python 标准库；可选模式在 MarkItDown 和 Frictionless 的公共接口上增加中文研究场景的输出。\n\n这是 AI 辅助个人实践项目。文献模块由此前个人 EPUB 提取脚本整理改进，其他模块在本项目中新增；不是上游项目的官方产品，也不代表已向上游提交或合并贡献。具体复用关系见 [开源来源与改进说明](ATTRIBUTION.md)。\n\n## 安装\n\nPython 3.10 或更高版本。基础模式无需安装第三方运行依赖，在仓库根目录即可运行：\n\n```console\npython -m research_data_toolkit --help\n```\n\n建议使用独立虚拟环境安装开源适配依赖：\n\n```console\npython -m venv .venv\n```\n\nWindows PowerShell：\n\n```powershell\n.\\.venv\\Scripts\\python.exe -m pip install -e \".[integrations]\"\n```\n\nmacOS / Linux：\n\n```sh\n.venv/bin/python -m pip install -e '.[integrations]'\n```\n\n以下命令中的 `python` 指已安装相应依赖的解释器。也可使用安装后的 `research-data` 命令替代 `python -m research_data_toolkit`。\n\n## 1 文献清洗与分块\n\n```console\npython -m research_data_toolkit clean examples/sample.txt --out-dir examples/output/clean --chunk-size 80\npython -m research_data_toolkit clean examples/plain.txt --engine markitdown --out-dir examples/output/markitdown --chunk-size 80\n```\n\n- 内置引擎支持 UTF-8/BOM TXT 与 UTF-8 内容的 EPUB。TXT 检测到常见 HTML 标签时去除标签；排除 script/style/head；规范化空白但保留段落。EPUB 按 spine 阅读顺序提取正文，不解压到磁盘。\n- `--engine markitdown` 调用开源 MarkItDown 本地文件转换接口，再使用本项目的规范化、分块与导出功能。该模式不保证保留 EPUB 的原始章节编号，`section` 表示转换后的整体正文。\n- 输出 `document.md`、`chunks.jsonl`、`stats.json`。每个片段包含稳定编号、来源文件名、SHA-256、章节序号、EPUB 内部成员路径与文本。长段落超过限制时按字符拆分，因此上限为字符数而非 token 数。\n- 相同源文件、引擎版本和参数下输出可复现。不会把绝对路径写进输出，不会覆盖输入。\n\n人工示例见 [清洗结果](examples/output/clean/document.md)、[分块结果](examples/output/clean/chunks.jsonl)。\n\n## 2 CSV 数据质量报告\n\n```console\npython -m research_data_toolkit quality examples/sample.csv --output examples/output/quality.md\npython -m research_data_toolkit quality examples/sample.csv --engine frictionless --output examples/output/quality-frictionless.md\n```\n\n输出行列数、完全重复行数量、各列缺失值、非空不同值数量、推断类型以及数值列的最小值、最大值、均值。`--engine frictionless` 额外调用上游推断与校验接口，整理成中文报告并保留其问题代码、行号与说明。\n\n数据源保持不变。仅支持逗号分隔、UTF-8/BOM CSV。空表头、重复表头、列数错位和引号格式错误会报错；只有表头时输出零行报告。空白字符串计作缺失，`NA`/`null` 等字面量不自动视为缺失；重复比较使用原始字段值。前导零、NaN、Inf 和混合值按文本处理。类型推断不能代替业务口径校验，上游自动推断后校验通过也不代表数据适合某项研究。\n\n人工示例见 [基础报告](examples/output/quality.md) 和 [开源适配报告](examples/output/quality-frictionless.md)。\n\n## 3 研究来源清单\n\n```console\npython -m research_data_toolkit sources examples/sources.csv --output examples/output/sources.md\n```\n\n输入必须包含 `title,institution,date,url,notes` 五列，允许其他列；前四列必填，备注可空。检查日历有效的 `YYYY-MM-DD` 日期、HTTP/HTTPS 链接格式和完全相同的重复链接，保留问题记录并生成来源清单与行号。只做格式核验，不访问网络，不确认链接可用性、机构身份或内容真实性。重复链接不会合并或删除。\n\n人工示例见 [来源清单及问题报告](examples/output/sources.md)。\n\n## 验证\n\n```console\npython -m unittest discover -s tests -v\n```\n\n基础模式会跳过两个未安装依赖的集成测试。安装 `.[integrations]` 后应全部运行。覆盖中文编码、空文件、损坏 EPUB、章节顺序、来源追溯、输出可复现性、缺失与重复、CSV 结构错误、非有限值、来源日期及链接问题、CLI 错误和防止覆盖输入。GitHub Actions 配置在 Python 3.10 和 3.12 上运行相同检查。\n\nCLI 成功输出报告时退出码为 0；输入、依赖或转换失败时为 2。来源清单中的格式问题属于成功生成的问题报告，不改变退出码。CLI 隐藏 traceback；Python API 保留异常，便于调试。\n\n## 边界\n\n- 不含 OCR、扫描 PDF、联网抓取、数据库、搜索服务或向量检索。内置 EPUB 采用纯文本提取，不保证保留表格、脚注与原书视觉布局。\n- 适合本地中小型资料，CSV 全量读入内存；EPUB 解压声明大小限制为 64 MiB。不要作为面向任意上传内容的公共服务器直接部署。\n- 示例全部为人工构造。原始书籍、未公开教材、个人简历、凭据和真实研究数据不包含在仓库中。\n- 输出到已存在的报告路径会替换旧报告；请为不同输入选择不同输出目录。原始输入受到覆盖保护。\n\nMIT 许可证。开源依赖保留各自许可证，见 [ATTRIBUTION.md](ATTRIBUTION.md)。\n",
            "research_data_toolkit/__init__.py": "\"\"\"Local research utilities with optional open-source integrations.\"\"\"\n\n__version__ = '0.1.0'\n",
            "research_data_toolkit/__main__.py": "import argparse\nimport sys\nfrom pathlib import Path\n\nfrom .clean import clean_document\nfrom .common import write_text\nfrom .quality import inspect_csv, quality_markdown\nfrom .sources import manage_sources, sources_markdown\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description='科研资料清洗与检查工具集')\n    subs = parser.add_subparsers(dest='command', required=True)\n    clean = subs.add_parser('clean', help='清洗 TXT/EPUB，输出 Markdown、JSONL 和统计')\n    clean.add_argument('input', type=Path)\n    clean.add_argument('--out-dir', type=Path, required=True)\n    clean.add_argument('--chunk-size', type=int, default=1200)\n    clean.add_argument('--engine', choices=['builtin', 'markitdown'], default='builtin')\n    quality = subs.add_parser('quality', help='检查 CSV 缺失、重复与列统计')\n    quality.add_argument('input', type=Path)\n    quality.add_argument('--output', type=Path, required=True)\n    quality.add_argument('--engine', choices=['builtin', 'frictionless'], default='builtin')\n    sources = subs.add_parser('sources', help='检查研究来源清单')\n    sources.add_argument('input', type=Path)\n    sources.add_argument('--output', type=Path, required=True)\n    args = parser.parse_args(argv)\n    try:\n        if args.command == 'clean':\n            clean_document(args.input, args.out_dir, args.chunk_size, args.engine)\n        elif args.command == 'quality':\n            write_text(args.output, quality_markdown(inspect_csv(args.input, args.engine)), args.input)\n        else:\n            report = manage_sources(args.input)\n            write_text(args.output, sources_markdown(report), args.input)\n        return 0\n    except Exception as exc:\n        # CLI boundary: third-party converters can raise their own error classes.\n        # Imported library APIs preserve exceptions for callers/debuggers.\n        print(f'Error: {exc}', file=sys.stderr)\n        return 2\n\n\nif __name__ == '__main__':\n    raise SystemExit(main())\n"
          }''')
          for name, content in files.items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts:
                  raise ValueError('Invalid repository path')
              path.parent.mkdir(parents=True, exist_ok=True)
              content = content.replace('__RDT_GH_EXPR__', '$' + '{{')
              path.write_text(content, encoding='utf-8', newline='\n')
          print(f'Imported {len(files)} reviewed public files')
      - name: Write reviewed public files batch 3
        shell: python
        run: |
          import json
          from pathlib import Path
          files = json.loads(r'''{
            "research_data_toolkit/clean.py": "\"\"\"EPUB/TXT cleanup evolved from the author's earlier EPUB extraction script.\n\nOptional MarkItDown adapter calls its public API; no upstream code is vendored.\n\"\"\"\nimport hashlib\nimport html\nimport json\nimport posixpath\nimport re\nimport zipfile\nfrom html.parser import HTMLParser\nfrom pathlib import Path\nfrom urllib.parse import unquote\nfrom xml.etree import ElementTree as ET\n\nfrom .common import json_text, write_text\n\n\nclass TextExtractor(HTMLParser):\n    BLOCKS = {'p', 'div', 'br', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'tr', 'blockquote'}\n    HIDDEN = {'head', 'script', 'style'}\n\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n        self.parts = []\n        self.hidden_depth = 0\n\n    def handle_starttag(self, tag, attrs):\n        if tag in self.HIDDEN:\n            self.hidden_depth += 1\n        if not self.hidden_depth and tag in self.BLOCKS:\n            self.parts.append('\\n\\n')\n\n    def handle_endtag(self, tag):\n        if tag in self.HIDDEN:\n            self.hidden_depth = max(0, self.hidden_depth - 1)\n        if not self.hidden_depth and tag in self.BLOCKS:\n            self.parts.append('\\n\\n')\n\n    def handle_data(self, data):\n        if not self.hidden_depth:\n            self.parts.append(data)\n\n\ndef normalize(text, markup=False):\n    if markup:\n        parser = TextExtractor()\n        parser.feed(text)\n        text = ''.join(parser.parts)\n    text = html.unescape(text).replace('\\xa0', ' ').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    lines = [re.sub(r'[ \\t]+', ' ', x).strip() for x in text.split('\\n')]\n    return re.sub(r'\\n{3,}', '\\n\\n', '\\n'.join(lines)).strip()\n\n\ndef _local_tag(node):\n    return node.tag.rsplit('}', 1)[-1]\n\n\ndef _epub(path):\n    try:\n        with zipfile.ZipFile(path) as archive:\n            if sum(x.file_size for x in archive.infolist()) > 64 * 1024 * 1024:\n                raise ValueError('EPUB 解压后大小超过 64 MiB 限制')\n            container = ET.fromstring(archive.read('META-INF/container.xml'))\n            rootfile = next(x.attrib['full-path'] for x in container.iter() if _local_tag(x) == 'rootfile')\n            opf = ET.fromstring(archive.read(rootfile))\n            title = next(((x.text or '').strip() for x in opf.iter() if _local_tag(x) == 'title'), '') or path.stem\n            author = next(((x.text or '').strip() for x in opf.iter() if _local_tag(x) == 'creator'), '')\n            manifest = {x.attrib['id']: x.attrib['href'] for x in opf.iter() if _local_tag(x) == 'item'}\n            spine = [x.attrib['idref'] for x in opf.iter() if _local_tag(x) == 'itemref']\n            sections = []\n            for number, item_id in enumerate(spine, 1):\n                href = unquote(manifest[item_id].split('#', 1)[0])\n                member = posixpath.normpath(posixpath.join(posixpath.dirname(rootfile), href))\n                if member.startswith('../') or member.startswith('/'):\n                    raise ValueError('EPUB 章节路径无效')\n                text = normalize(archive.read(member).decode('utf-8-sig'), markup=True)\n                if text:\n                    sections.append((number, member, text))\n            return title, author, sections\n    except (zipfile.BadZipFile, ET.ParseError, KeyError, StopIteration, UnicodeError) as exc:\n        raise ValueError(f'无法解析 EPUB：{type(exc).__name__}') from exc\n\n\ndef clean_document(source, out_dir, chunk_size=1200, engine='builtin'):\n    source, out_dir = Path(source), Path(out_dir)\n    if chunk_size < 1:\n        raise ValueError('chunk-size 必须大于 0')\n    if source.suffix.lower() not in {'.txt', '.epub'}:\n        raise ValueError('仅支持 TXT 和 EPUB')\n    for name in ['document.md', 'chunks.jsonl', 'stats.json']:\n        if (out_dir / name).resolve() == source.resolve():\n            raise ValueError('输出路径不能覆盖输入文件')\n    digest = hashlib.sha256(source.read_bytes()).hexdigest()\n    if engine == 'markitdown':\n        try:\n            from markitdown import MarkItDown\n        except ImportError as exc:\n            raise ValueError('请先安装开源适配依赖：pip install \".[integrations]\"') from exc\n        result = MarkItDown(enable_plugins=False).convert_local(str(source))\n        text = normalize(result.text_content)\n        title, author, sections = source.stem, '', [(1, source.name, text)] if text else []\n    elif engine == 'builtin':\n        if source.suffix.lower() == '.epub':\n            title, author, sections = _epub(source)\n        else:\n            raw = source.read_text(encoding='utf-8-sig')\n            markup = bool(re.search(r'</?(?:p|div|br|h[1-6]|script|style|html|span)\\b', raw, flags=re.I))\n            text = normalize(raw, markup=markup)\n            title, author, sections = source.stem, '', [(1, source.name, text)] if text else []\n    else:\n        raise ValueError('未知文献处理引擎')\n    if not sections:\n        raise ValueError('文档没有可提取的正文')\n    chunks = []\n    lines = [f'# {title}', '', f'来源：{source.name}', f'作者：{author or \"未提供\"}', '']\n    for section, member, text in sections:\n        lines.extend([f'## 内容 {section}', '', text, ''])\n        pieces, current = [], ''\n        for paragraph in text.split('\\n\\n'):\n            if current and len(current) + 2 + len(paragraph) > chunk_size:\n                pieces.append(current)\n                current = ''\n            while len(paragraph) > chunk_size:\n                pieces.append(paragraph[:chunk_size])\n                paragraph = paragraph[chunk_size:]\n            if paragraph:\n                current = f'{current}\\n\\n{paragraph}' if current else paragraph\n        if current:\n            pieces.append(current)\n        for index, piece in enumerate(pieces, 1):\n            chunks.append({'id': f'{digest[:12]}-{section}-{index}', 'title': title, 'author': author,\n                           'source_file': source.name, 'source_sha256': digest, 'section': section,\n                           'source_member': member, 'text': piece})\n    stats = {'source_file': source.name, 'source_sha256': digest, 'engine': engine,\n             'sections': len(sections), 'characters': sum(len(x[2]) for x in sections),\n             'chunks': len(chunks), 'chunk_size': chunk_size}\n    write_text(out_dir / 'document.md', '\\n'.join(lines).rstrip() + '\\n', source)\n    write_text(out_dir / 'chunks.jsonl', ''.join(json.dumps(x, ensure_ascii=False) + '\\n' for x in chunks), source)\n    write_text(out_dir / 'stats.json', json_text(stats), source)\n    return stats\n",
            "research_data_toolkit/common.py": "import csv\nimport json\nfrom pathlib import Path\n\n\ndef read_csv(path):\n    \"\"\"Read comma-separated UTF-8 CSV; reject ambiguous headers and shapes.\"\"\"\n    with Path(path).open(encoding='utf-8-sig', newline='') as f:\n        reader = csv.reader(f, strict=True)\n        try:\n            headers = next(reader, [])\n            if not headers or any(not x.strip() for x in headers):\n                raise ValueError('CSV 不能为空，且必须包含非空表头')\n            headers = [x.strip() for x in headers]\n            if len(set(headers)) != len(headers):\n                raise ValueError('CSV 表头不能重复')\n            rows = []\n            for row in reader:\n                if len(row) != len(headers):\n                    raise ValueError(f'CSV 第 {reader.line_num} 行字段数不匹配')\n                rows.append(row)\n        except csv.Error as exc:\n            raise ValueError(f'CSV 格式错误：{exc}') from exc\n    return headers, rows\n\n\ndef cell(value):\n    return str(value).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('|', '&#124;').replace('\\r', ' ').replace('\\n', '<br>')\n\n\ndef write_text(path, text, source=None):\n    path = Path(path)\n    if source is not None and path.resolve() == Path(source).resolve():\n        raise ValueError('输出路径不能覆盖输入文件')\n    path.parent.mkdir(parents=True, exist_ok=True)\n    path.write_text(text, encoding='utf-8', newline='\\n')\n\n\ndef json_text(value):\n    return json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + '\\n'\n"
