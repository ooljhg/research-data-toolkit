            "research_data_toolkit/quality.py": "\"\"\"Chinese CSV profiling and an optional Frictionless validation adapter.\"\"\"\nimport math\nimport re\nimport statistics\nfrom collections import Counter\nfrom pathlib import Path\n\nfrom .common import cell, read_csv\n\n\ndef inspect_csv(source, engine='builtin'):\n    headers, rows = read_csv(source)\n    columns = {}\n    for i, header in enumerate(headers):\n        values = [row[i].strip() for row in rows if row[i].strip()]\n        item = {'missing': len(rows) - len(values), 'nonmissing': len(values), 'unique': len(set(values)), 'type': 'empty'}\n        if values:\n            # Preserve identifiers with leading zeros as text. NaN/Inf aren't measurements.\n            numeric = all(re.fullmatch(r'[+-]?(?:0|[1-9]\\d*)(?:\\.\\d+)?(?:[eE][+-]?\\d+)?', v) for v in values)\n            numbers = [float(v) for v in values] if numeric else []\n            if numbers and all(math.isfinite(n) for n in numbers):\n                item['type'] = 'integer' if all(re.fullmatch(r'[+-]?(?:0|[1-9]\\d*)', v) for v in values) else 'number'\n                item.update(min=min(numbers), max=max(numbers), mean=statistics.mean(numbers))\n            else:\n                item['type'] = 'text'\n        columns[header] = item\n    report = {'source_file': Path(source).name, 'row_count': len(rows), 'column_count': len(headers),\n              'duplicate_rows': sum(n - 1 for n in Counter(tuple(row) for row in rows).values()), 'columns': columns}\n    if engine == 'frictionless':\n        try:\n            from frictionless import Resource\n        except ImportError as exc:\n            raise ValueError('请先安装开源适配依赖：pip install \".[integrations]\"') from exc\n        # Public local-file API. Let upstream infer types and return its own checks.\n        resolved = Path(source).resolve()\n        resource = Resource(path=resolved.name, basepath=str(resolved.parent))\n        resource.infer()\n        validation = resource.validate()\n        report['upstream'] = {'engine': 'frictionless', 'valid': validation.valid,\n                              'errors': [{'row': e.get('rowNumber'), 'field': e.get('fieldName'),\n                                          'code': e.get('type'), 'message': e.get('message')}\n                                         for task in validation.to_descriptor().get('tasks', []) for e in task.get('errors', [])]}\n    elif engine != 'builtin':\n        raise ValueError('未知 CSV 检查引擎')\n    return report\n\n\ndef quality_markdown(report):\n    lines = ['# CSV 数据质量检查', '', f'文件：{cell(report[\"source_file\"])}', '',\n             f'数据行数：{report[\"row_count\"]}；列数：{report[\"column_count\"]}；重复行数：{report[\"duplicate_rows\"]}', '',\n             '重复行指完全相同的原始字段组合，计数不包含首次出现；空白值仅用于缺失统计，不改写源文件。', '',\n             '| 列名 | 推断类型 | 缺失数 | 非空不同值 | 最小值 | 最大值 | 均值 |',\n             '| --- | --- | ---: | ---: | ---: | ---: | ---: |']\n    for name, info in report['columns'].items():\n        vals = [name, info['type'], info['missing'], info['unique']] + [format(info[k], '.6g') if k in info else '—' for k in ['min', 'max', 'mean']]\n        lines.append('| ' + ' | '.join(cell(v) for v in vals) + ' |')\n    lines.extend(['', '类型为启发式推断，不代替业务口径核验；前导零、非有限值和混合类型按文本处理。'])\n    if 'upstream' in report:\n        upstream = report['upstream']\n        lines.extend(['', '## Frictionless 开源校验', '', f'上游校验通过：{upstream[\"valid\"]}', '', '| 行 | 字段 | 问题代码 | 说明 |', '| --- | --- | --- | --- |'])\n        for err in upstream['errors']:\n            lines.append('| ' + ' | '.join(cell(err[k] if err[k] is not None else '—') for k in ['row', 'field', 'code', 'message']) + ' |')\n        lines.extend(['', '上游校验使用自动推断的结构；通过不代表数据已满足具体研究的业务要求。'])\n    return '\\n'.join(lines) + '\\n'\n",
            "research_data_toolkit/sources.py": "import re\nfrom datetime import date\nfrom pathlib import Path\nfrom urllib.parse import urlsplit\n\nfrom .common import cell, read_csv\n\nFIELDS = ['title', 'institution', 'date', 'url', 'notes']\n\n\ndef manage_sources(source):\n    headers, rows = read_csv(source)\n    if set(FIELDS) - set(headers):\n        raise ValueError('来源 CSV 必须包含 title,institution,date,url,notes 五列')\n    sources, issues, seen = [], [], {}\n    for number, row in enumerate(rows, 2):\n        item = {k: row[headers.index(k)].strip() for k in FIELDS}\n        sources.append(item)\n        def issue(code, message):\n            issues.append({'row': number, 'code': code, 'message': message})\n        for key in FIELDS[:-1]:\n            if not item[key]:\n                issue(f'missing_{key}', f'{key} 不能为空')\n        if item['date']:\n            try:\n                if not re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', item['date']):\n                    raise ValueError\n                date.fromisoformat(item['date'])\n            except ValueError:\n                issue('invalid_date', '日期须为有效的 YYYY-MM-DD')\n        if item['url']:\n            try:\n                parsed = urlsplit(item['url'])\n                if parsed.scheme not in {'http', 'https'} or not parsed.hostname or any(c.isspace() for c in item['url']):\n                    raise ValueError\n            except ValueError:\n                issue('invalid_url', '链接须为完整 HTTP 或 HTTPS 地址')\n            if item['url'] in seen:\n                issue('duplicate_url', f'链接与第 {seen[item[\"url\"]]} 行重复')\n            else:\n                seen[item['url']] = number\n    return {'source_file': Path(source).name, 'row_count': len(rows), 'sources': sources, 'issues': issues}\n\n\ndef sources_markdown(report):\n    lines = ['# 研究资料来源清单', '', f'文件：{cell(report[\"source_file\"])}；记录数：{report[\"row_count\"]}；问题数：{len(report[\"issues\"])}', '',\n             '本工具仅进行本地格式检查，不访问链接，也不确认资料真实性或可用性。', '',\n             '| CSV 行 | 标题 | 机构 | 日期 | 链接 | 备注 |', '| ---: | --- | --- | --- | --- | --- |']\n    for number, source in enumerate(report['sources'], 2):\n        lines.append('| ' + ' | '.join([str(number)] + [cell(source[k]) for k in FIELDS]) + ' |')\n    lines.extend(['', '## 问题报告', '', '| CSV 行 | 问题代码 | 说明 |', '| ---: | --- | --- |'])\n    for issue in report['issues']:\n        lines.append('| ' + ' | '.join(cell(issue[k]) for k in ['row', 'code', 'message']) + ' |')\n    if not report['issues']:\n        lines.append('| — | — | 未发现格式问题 |')\n    return '\\n'.join(lines) + '\\n'\n",
            "tests/test_integrations.py": "import importlib.util\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom research_data_toolkit.clean import clean_document\nfrom research_data_toolkit.quality import inspect_csv, quality_markdown\n\n\nclass IntegrationTests(unittest.TestCase):\n    @unittest.skipUnless(importlib.util.find_spec('markitdown'), 'Install .[integrations] for MarkItDown test')\n    def test_real_markitdown_adapter(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            source = Path(tmp) / 'example.txt'\n            source.write_text('第一段正文\\n\\n第二段正文', encoding='utf-8')\n            out = Path(tmp) / 'out'\n            stats = clean_document(source, out, chunk_size=8, engine='markitdown')\n            self.assertEqual(stats['engine'], 'markitdown')\n            self.assertIn('第一段正文', (out / 'document.md').read_text(encoding='utf-8'))\n            self.assertGreaterEqual(stats['chunks'], 2)\n\n    @unittest.skipUnless(importlib.util.find_spec('frictionless'), 'Install .[integrations] for Frictionless test')\n    def test_real_frictionless_adapter(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            source = Path(tmp) / 'example.csv'\n            source.write_text('city,value\\nBeijing,12\\nShanghai,18\\n', encoding='utf-8')\n            report = inspect_csv(source, engine='frictionless')\n            self.assertTrue(report['upstream']['valid'])\n            self.assertIn('Frictionless 开源校验', quality_markdown(report))\n            self.assertEqual(report['columns']['value']['mean'], 15)\n\n\nif __name__ == '__main__':\n    unittest.main()\n"
